apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: glvis-server
  namespace: laghos-demo
  labels:
    app: glvis-server
    app.kubernetes.io/name: glvis-server
    app.kubernetes.io/component: visualization
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: glvis-server
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
# WebSocket route for live visualization streaming
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: glvis-websocket
  namespace: laghos-demo
  labels:
    app: glvis-server
    app.kubernetes.io/name: glvis-server
    app.kubernetes.io/component: visualization
  annotations:
    haproxy.router.openshift.io/timeout: 300s
    # Enable WebSocket support
    haproxy.router.openshift.io/balance: source
spec:
  to:
    kind: Service
    name: glvis-server
    weight: 100
  port:
    targetPort: websocket
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
